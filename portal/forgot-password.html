<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Reset your password | Riara University International Students</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/favicon/favicon-180.png">
<link rel="stylesheet" href="../css/Full_style.css">
</head>
<body data-page="portal">

<div id="site-header"></div>
<script src="../js/layout.js"></script>
<div id="pilotBanner"></div>

<header class="page-header">
  <div class="container">
    <p class="breadcrumb"><a href="../index.html">Home</a> / Forgot password</p>
    <h1>Reset your password</h1>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card">
    <form class="auth-form is-active" id="forgotForm" novalidate>
      <h2>Forgot your password?</h2>
      <p class="auth-subtext">Enter your account email and we'll send you a link to choose a new one.</p>
      <div class="auth-banner" id="authBanner" role="alert"></div>
      <div class="form-group">
        <label for="forgot-email">Email address</label>
        <input type="email" id="forgot-email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn btn-primary">Send reset link</button>
      <p class="auth-switch-text"><a href="sign-in.html">Back to sign in</a></p>
    </form>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/portal/forgot-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Choose a new password | Riara University International Students</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/favicon/favicon-180.png">
<link rel="stylesheet" href="../css/Full_style.css">
</head>
<body data-page="portal">

<div id="site-header"></div>
<script src="../js/layout.js"></script>
<div id="pilotBanner"></div>

<header class="page-header">
  <div class="container">
    <p class="breadcrumb"><a href="../index.html">Home</a> / New password</p>
    <h1>Choose a new password</h1>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card">
    <p class="checking-msg" id="resetChecking">Checking your link…</p>
    <form class="auth-form" id="resetForm" novalidate>
      <h2>Choose a new password</h2>
      <div class="auth-banner" id="authBanner" role="alert"></div>
      <div class="form-group">
        <label for="reset-password">New password</label>
        <input type="password" id="reset-password" autocomplete="new-password" required>
        <ul class="password-rules" id="passwordRules">
          <li data-rule="length">At least 8 characters</li>
          <li data-rule="upper">A capital letter</li>
          <li data-rule="lower">A small letter</li>
          <li data-rule="digit">A number</li>
        </ul>
      </div>
      <div class="form-group">
        <label for="reset-confirm">Confirm new password</label>
        <input type="password" id="reset-confirm" autocomplete="new-password" required>
        <span class="password-mismatch-hint" id="mismatchHint">Passwords don't match yet.</span>
      </div>
      <button type="submit" class="btn btn-primary">Save new password</button>
    </form>
    <div class="auth-message" id="resetInvalid" hidden>
      <h2>This link has expired</h2>
      <p>Reset links work once, for 1 hour. Request a new one.</p>
      <p><a class="btn btn-primary" href="forgot-password.html">Send a new link</a></p>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/portal/password-rules.js"></script>
<script src="../js/portal/reset-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Staff Dashboard | Riara University International Students</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/favicon-180.png">
<link rel="stylesheet" href="css/Full_style.css">
</head>
<body>

<div id="site-header"></div>
<script src="js/layout.js"></script>

<!-- ============ Page header ============ -->
<header class="page-header">
  <div class="container">
    <p class="breadcrumb"><a href="index.html">Home</a> / Staff Dashboard</p>
    <h1>Staff Dashboard</h1>
  </div>
</header>

<!-- ============ Sign-in check ============ -->
<section class="page-section" id="staffChecking">
  <div class="container">
    <p class="checking-msg">Checking your sign-in...</p>
  </div>
</section>

<!-- ============ Dashboard ============ -->
<section class="page-section" id="staffApp" hidden>
  <div class="container">
    <span class="auth-preview-tag">🚧 Preview — sample data only</span>

    <div class="staff-bar">
      <p class="who">Signed in as <strong id="staffWho"></strong></p>
      <div class="staff-bar-actions">
        <button type="button" class="btn btn-secondary btn-small" id="resetBtn">Reset sample data</button>
        <button type="button" class="btn btn-secondary btn-small" id="signOutBtn">Sign out</button>
      </div>
    </div>

    <div class="filters">
      <input type="search" id="searchInput" placeholder="Search by name, student ID or email" aria-label="Search submissions">
      <select id="statusFilter" aria-label="Filter by status"></select>
      <label class="filter-date">Submitted from <input type="date" id="dateFilter"></label>
    </div>
    <p class="results-count" id="resultsCount"></p>

    <div class="table-wrap">
      <table class="sub-table">
        <thead>
          <tr>
            <th>Student</th>
            <th>Student ID</th>
            <th>Country</th>
            <th>Status</th>
            <th>Submitted</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="detail-panel" id="detailPanel"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/main.js"></script>
<script src="js/staff-access.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
